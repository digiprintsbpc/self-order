<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dapur — Order Kuliner</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; background: #17181c; color: #f2f2f2; }
  header { padding: 14px 18px; display: flex; justify-content: space-between; align-items: center; background: #1f2126; position: sticky; top: 0; z-index: 5; }
  header h1 { font-size: 18px; }
  header button { background: #2c2f36; color: #ddd; border: 0; border-radius: 8px; padding: 8px 12px; cursor: pointer; }
  .kolom { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 14px; padding: 14px; align-items: start; }
  .grup h2 { font-size: 14px; letter-spacing: .06em; margin-bottom: 10px; color: #bbb; }
  .kartu { background: #23252c; border-radius: 14px; padding: 14px; margin-bottom: 12px; border-left: 6px solid #666; }
  .kartu.dibayar { border-color: #e8a13a; }
  .kartu.dimasak { border-color: #4a90d9; }
  .kartu.siap { border-color: #35b558; }
  .kartu .atas { display: flex; justify-content: space-between; align-items: baseline; }
  .antrian { font-size: 34px; font-weight: 800; }
  .meta { color: #aaa; font-size: 13px; }
  .item { padding: 7px 0; border-bottom: 1px dashed #333; font-size: 15px; }
  .item:last-of-type { border-bottom: 0; }
  .item .dt { color: #f0b429; font-size: 13px; }
  .item .ct { color: #ff8f81; font-size: 13px; font-style: italic; }
  .aksi { width: 100%; margin-top: 12px; border: 0; border-radius: 10px; padding: 12px; font-size: 15px; font-weight: 700; cursor: pointer; color: #111; }
  .aksi.dibayar { background: #e8a13a; }
  .aksi.dimasak { background: #35b558; color: #fff; }
  .aksi.siap { background: #3a3d45; color: #ddd; }
  #login { max-width: 360px; margin: 60px auto; background: #23252c; padding: 22px; border-radius: 14px; }
  #login input { width: 100%; padding: 11px; border-radius: 9px; border: 1px solid #3a3d45; background: #17181c; color: #fff; margin: 8px 0 14px; font-size: 15px; }
  #login button { width: 100%; padding: 12px; border: 0; border-radius: 10px; background: #b3231b; color: #fff; font-weight: 700; cursor: pointer; }
  .kosong { color: #777; font-size: 14px; padding: 8px 0; }
  #err { color: #ff8f81; font-size: 13px; min-height: 18px; }
</style>
</head>
<body>
<div id="login" style="display:none">
  <h2 style="margin-bottom:6px">🍳 Layar Dapur</h2>
  <p style="color:#aaa;font-size:13px">Masuk dengan PIN usaha.</p>
  <input type="password" id="pinInput" placeholder="PIN" inputmode="numeric">
  <div id="err"></div>
  <button id="btnMasuk">Masuk</button>
</div>

<div id="app" style="display:none">
  <header>
    <h1>🍳 Dapur — <span id="namaUsaha"></span></h1>
    <div>
      <button id="btnBunyi">🔔 Tes Bunyi</button>
      <button id="btnKeluar">Keluar</button>
    </div>
  </header>
  <div class="kolom">
    <div class="grup"><h2>🟠 BARU MASUK</h2><div id="g-dibayar"></div></div>
    <div class="grup"><h2>🔵 SEDANG DIMASAK</h2><div id="g-dimasak"></div></div>
    <div class="grup"><h2>🟢 SIAP DIAMBIL</h2><div id="g-siap"></div></div>
  </div>
</div>

<script>
const qs = new URLSearchParams(location.search);
const TENANT = qs.get('t') || 'warung-demo';
const KUNCI = 'ok_pin_' + TENANT;
let PIN = localStorage.getItem(KUNCI) || '';
let terlihat = new Set();
let audioCtx = null;

function bunyi(n) {
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    for (let i = 0; i < (n || 2); i++) {
      const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.connect(g); g.connect(audioCtx.destination);
      o.frequency.value = 990; g.gain.value = 0.18;
      const t = audioCtx.currentTime + i * 0.3;
      o.start(t); o.stop(t + 0.2);
    }
  } catch {}
}
document.getElementById('btnBunyi').onclick = () => bunyi(1);

function menitLalu(iso) {
  const m = Math.max(0, Math.round((Date.now() - new Date(iso).getTime()) / 60000));
  return m === 0 ? 'baru saja' : m + ' mnt lalu';
}

async function ambil() {
  const r = await fetch('/api/dapur?tenant=' + encodeURIComponent(TENANT) + '&pin=' + encodeURIComponent(PIN));
  const d = await r.json();
  if (!d.ok) throw new Error(d.error || 'Gagal memuat');
  return d.orders;
}

function kartu(o) {
  const label = { dibayar: 'Mulai Masak', dimasak: 'Siap Diambil', siap: 'Selesai / Sudah Diambil' }[o.status];
  return `<div class="kartu ${o.status}">
    <div class="atas">
      <span class="antrian">#${o.nomor_antrian}</span>
      <span class="meta">${o.nomor_meja ? 'Meja ' + o.nomor_meja + ' · ' : ''}${o.nama_pelanggan || ''} · ${menitLalu(o.created_at)}</span>
    </div>
    ${o.items.map((i) => `<div class="item"><b>${i.qty}×</b> ${i.nama}
      ${i.level !== null && i.level !== undefined ? `<div class="dt">🌶 Level ${i.level}</div>` : ''}
      ${(i.ekstra || []).length ? `<div class="dt">+ ${i.ekstra.map((e) => e.nama).join(', ')}</div>` : ''}
      ${i.catatan ? `<div class="ct">“${i.catatan}”</div>` : ''}</div>`).join('')}
    <button class="aksi ${o.status}" onclick="maju('${o.id}','${ {dibayar:'dimasak', dimasak:'siap', siap:'selesai'}[o.status] }')">${label}</button>
  </div>`;
}

async function gambar() {
  try {
    const orders = await ambil();
    for (const st of ['dibayar', 'dimasak', 'siap']) {
      const list = orders.filter((o) => o.status === st);
      document.getElementById('g-' + st).innerHTML = list.map(kartu).join('') || '<div class="kosong">Tidak ada.</div>';
    }
    // Bunyi bila ada order baru yang belum pernah terlihat
    let baru = false;
    for (const o of orders) {
      if (o.status === 'dibayar' && !terlihat.has(o.id)) baru = true;
      terlihat.add(o.id);
    }
    if (baru && terlihat.size > orders.length - 1) bunyi(2);
  } catch (e) {
    if (/PIN/.test(e.message)) { keluar(); }
  }
}

async function maju(orderId, status) {
  const r = await fetch('/api/dapur', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ tenant: TENANT, pin: PIN, order_id: orderId, status }),
  });
  const d = await r.json();
  if (!d.ok) alert(d.error || 'Gagal mengubah status');
  gambar();
}

function keluar() {
  localStorage.removeItem(KUNCI); PIN = '';
  document.getElementById('app').style.display = 'none';
  document.getElementById('login').style.display = 'block';
}
document.getElementById('btnKeluar').onclick = keluar;

document.getElementById('btnMasuk').onclick = async () => {
  PIN = document.getElementById('pinInput').value.trim();
  document.getElementById('err').textContent = '';
  try {
    const orders = await ambil();
    localStorage.setItem(KUNCI, PIN);
    document.getElementById('login').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    terlihat = new Set(orders.map((o) => o.id));
    gambar();
  } catch (e) { document.getElementById('err').textContent = e.message; }
};

(async function () {
  document.getElementById('namaUsaha').textContent = TENANT;
  if (PIN) {
    try {
      await ambil();
      document.getElementById('app').style.display = 'block';
      gambar();
    } catch { document.getElementById('login').style.display = 'block'; }
  } else {
    document.getElementById('login').style.display = 'block';
  }
  setInterval(() => { if (PIN && document.getElementById('app').style.display !== 'none') gambar(); }, 5000);
})();
</script>
</body>
</html>
